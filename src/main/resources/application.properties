spring.application.name=javaPractice

# 数据库连接配置（请替换为实际值）
spring.datasource.url=jdbc:mysql://localhost:3306/reggie?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 服务器端口
server.port=8085

# 文件上传路径
reggie.path=images/

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB

# Redis 配置（请替换为实际值）
spring.redis.host=localhost
spring.redis.port=6379

# Spring Cache Redis TTL（单位：毫秒，默认30分钟）
spring.cache.redis.time-to-live=1800000
